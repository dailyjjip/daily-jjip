name: 검수 시험 (기존 게시물)

on:
  workflow_dispatch:
    inputs:
      dir:
        description: "posts 아래 폴더 이름"
        required: true
      cmd:
        description: "review_dir 또는 pick_dir"
        default: review_dir

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python main.py ${{ github.event.inputs.cmd }} ${{ github.event.inputs.dir }} > out.txt && echo "::notice::$(grep '결과\|선택' out.txt | tr '\n' ' ')" || { echo "::error::$(tail -c 900 last_error.txt | tr "\n" " ")"; exit 1; }
