name: 오늘의 이슈 카드뉴스

on:
  schedule:
    # 한국시간 08:10 / 12:10 / 19:10 (UTC 기준으로 9시간 빼서 적음)
    - cron: "10 23 * * *"
    - cron: "10 3 * * *"
    - cron: "10 10 * * *"
  workflow_dispatch: {}   # 깃허브 화면에서 수동 실행 버튼

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 한글 폰트 설치
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra

      - name: 3D 아이콘 받기 (Fluent Emoji 3D, MIT 라이선스)
        run: |
          mkdir -p emoji && cd emoji
          npm pack @lobehub/fluent-emoji-3d --silent
          tar xzf *.tgz

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: 1) 이슈 선정 + 카드 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python main.py generate

      - name: 이미지 업로드 (공개 URL 만들기)
        run: |
          git config user.name "cardnews-bot"
          git config user.email "bot@users.noreply.github.com"
          git add posts pending.json
          git commit -m "card: $(date -u +%Y%m%d_%H%M)"
          git push
          sleep 20

      - name: 2) 인스타그램 게시
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/posts
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
        run: python main.py publish

      - name: 게시 기록 저장
        run: |
          git add -A
          git commit -m "posted" || true
          git push

      - name: 오류 기록 저장 (실패했을 때만)
        if: failure()
        run: |
          git config user.name "cardnews-bot"
          git config user.email "bot@users.noreply.github.com"
          git add last_error.txt || true
          git commit -m "error log" || true
          git push || true
