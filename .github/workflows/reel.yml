name: 릴스만 게시 (기존 게시물)

on:
  workflow_dispatch:
    inputs:
      dir:
        description: "posts 아래 폴더 이름 (예: 20261016_0332)"
        required: true

permissions:
  contents: write

jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 한글 폰트 설치
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 릴스 영상 만들기
        run: python main.py reel_make ${{ github.event.inputs.dir }}
      - name: 영상 업로드
        run: |
          git config user.name "cardnews-bot"
          git config user.email "bot@users.noreply.github.com"
          git add posts && git commit -qm "reel ${{ github.event.inputs.dir }}" || true
          git pull -q --rebase && git push -q
          sleep 20
      - name: 릴스 게시
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/posts
        run: python main.py reel_post ${{ github.event.inputs.dir }}
