name: 질문 댓글 답글 (하루 최대 3개)

on:
  schedule:
    - cron: "40 1,4,9,13 * * *"   # 한국시간 10:40 / 13:40 / 18:40 / 22:40
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 질문 댓글에만 짧게 답글
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python comment_reply.py
      - name: 기록 저장
        if: always()
        run: |
          git config user.name "cardnews-bot"
          git config user.email "bot@users.noreply.github.com"
          git add comments.json health.json costs.json 2>/dev/null || true
          git commit -qm "comments: $(date -u +%Y%m%d_%H%M)" || true
          git pull -q --rebase && git push -q || true
